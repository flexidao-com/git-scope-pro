# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html
pluginGroup=org.woelkit.plugins
pluginName=Git Scope
pluginRepositoryUrl=https://github.com/comod/git-scope-pro
# Fork version: sorts above every upstream Marketplace release so the IDE never offers to
# replace this build with the published Git Scope plugin (same plugin ID).
pluginVersion=9999.flexidao.1
pluginSinceBuild=261

platformType=IU
#platformVersion=LATEST-EAP-SNAPSHOT
platformVersion=2026.2

platformBundledPlugins=Git4Idea
gradleVersion=9.7.1
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching = true
org.gradle.jvmargs=-Xms1g -Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8